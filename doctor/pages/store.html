<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
GLOBAL HEALTHCARE | Store
</title>


<style>

/* ======================================================
   RESET
====================================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

}


body {

    background:
        linear-gradient(
            180deg,
            #f8fbff,
            #f1f5f9
        );

    color: #0f172a;

    min-height: 100vh;

}


/* ======================================================
   TOP BAR
====================================================== */

.shop-bar {

    position: sticky;

    top: 0;

    z-index: 1000;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:
        blur(12px);

    border-bottom:
        1px solid #e2e8f0;

    box-shadow:
        0 5px 25px rgba(15,23,42,.06);

}


.shop-bar-inner {

    max-width: 1250px;

    margin: auto;

    min-height: 72px;

    padding:
        10px 18px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    gap: 15px;

}


.shop-title {

    color:
        #1e3a8a;

    font-size: 21px;

    font-weight: 900;

}


.shop-subtitle {

    color:
        #64748b;

    font-size: 11px;

    margin-top: 2px;

}


.shop-cart {

    text-decoration: none;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    padding:
        10px 15px;

    border-radius:
        11px;

    font-size: 13px;

    font-weight: 800;

    box-shadow:
        0 5px 15px
        rgba(37,99,235,.20);

}


.shop-cart span {

    background:
        #ef4444;

    padding:
        2px 7px;

    border-radius:
        20px;

    margin-left:
        3px;

}


/* ======================================================
   CONTAINER
====================================================== */

.container {

    max-width: 1250px;

    margin: auto;

    padding:
        25px 16px 50px;

}


/* ======================================================
   WELCOME
====================================================== */

.welcome {

    margin-bottom:
        20px;

}


.welcome h1 {

    color:
        #1e3a8a;

    font-size:
        24px;

    font-weight:
        900;

}


.welcome p {

    color:
        #64748b;

    font-size:
        13px;

    margin-top:
        4px;

}


/* ======================================================
   SEARCH
====================================================== */

.search-box {

    background:
        white;

    border:
        1px solid #e2e8f0;

    border-radius:
        15px;

    padding:
        13px 15px;

    margin-bottom:
        22px;

    box-shadow:
        0 8px 25px
        rgba(15,23,42,.05);

}


.search-input {

    width: 100%;

    border: none;

    outline: none;

    background:
        transparent;

    font-size:
        14px;

}


/* ======================================================
   INFO
====================================================== */

.shop-info {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    margin-bottom:
        15px;

}


.shop-info h2 {

    font-size:
        19px;

}


.shop-info span {

    color:
        #64748b;

    font-size:
        12px;

}


/* ======================================================
   PRODUCT GRID
====================================================== */

.product-grid {

    display:
        grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:
        18px;

}


/* ======================================================
   PRODUCT CARD
====================================================== */

.product-card {

    background:
        rgba(255,255,255,.98);

    border:
        1px solid #e2e8f0;

    border-radius:
        18px;

    padding:
        12px;

    box-shadow:
        0 8px 25px
        rgba(15,23,42,.05);

    transition:
        .25s;

}


.product-card:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 18px 40px
        rgba(30,64,175,.13);

}


/* ======================================================
   IMAGE
====================================================== */

.product-image {

    width: 100%;

    height:
        200px;

    background:
        linear-gradient(
            145deg,
            #eff6ff,
            #f8fafc
        );

    border-radius:
        14px;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    margin-bottom:
        12px;

}


.product-img {

    width: 100%;

    height: 100%;

    object-fit:
        contain;

}


.image-placeholder {

    font-size:
        55px;

}


/* ======================================================
   CONTENT
====================================================== */

.category {

    color:
        #2563eb;

    font-size:
        10px;

    font-weight:
        900;

    text-transform:
        uppercase;

    margin-bottom:
        5px;

}


.product-card h3 {

    font-size:
        16px;

    line-height:
        1.35;

    margin-bottom:
        5px;

}


.description {

    color:
        #64748b;

    font-size:
        11px;

    line-height:
        1.45;

    height:
        32px;

    overflow:
        hidden;

}


.brand {

    color:
        #475569;

    font-size:
        11px;

    font-weight:
        700;

    margin-top:
        8px;

}


/* ======================================================
   STOCK
====================================================== */

.stock {

    display:
        block;

    margin-top:
        8px;

    font-size:
        11px;

    font-weight:
        900;

}


.in-stock {

    color:
        #16a34a;

}


.out-stock {

    color:
        #dc2626;

}


/* ======================================================
   BUTTON
====================================================== */

.view-btn {

    width:
        100%;

    border:
        none;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color:
        white;

    padding:
        11px;

    margin-top:
        10px;

    border-radius:
        10px;

    font-size:
        12px;

    font-weight:
        900;

    cursor:
        pointer;

}


.view-btn:hover {

    background:
        #1d4ed8;

}


/* ======================================================
   EMPTY
====================================================== */

.empty {

    grid-column:
        1 / -1;

    text-align:
        center;

    background:
        white;

    padding:
        60px 20px;

    border-radius:
        18px;

    color:
        #64748b;

}


.empty-icon {

    font-size:
        50px;

    margin-bottom:
        10px;

}


/* ======================================================
   MODAL
====================================================== */

.product-modal {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(15,23,42,.72);

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        15px;

    z-index:
        5000;

}


.product-modal.show {

    display:
        flex;

}


.product-detail {

    background:
        white;

    width:
        100%;

    max-width:
        950px;

    max-height:
        94vh;

    overflow:
        auto;

    border-radius:
        22px;

    padding:
        22px;

    position:
        relative;

}


.close-btn {

    position:
        absolute;

    right:
        15px;

    top:
        15px;

    width:
        38px;

    height:
        38px;

    border:
        none;

    border-radius:
        50%;

    background:
        #f1f5f9;

    font-size:
        22px;

    cursor:
        pointer;

    z-index:
        5;

}


/* ======================================================
   DETAIL
====================================================== */

.detail-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        25px;

}


.detail-image {

    width:
        100%;

    height:
        390px;

    background:
        #f1f5ff;

    border-radius:
        16px;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

}


.detail-image img {

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

}


.detail-title {

    font-size:
        28px;

    margin-bottom:
        8px;

}


.detail-category {

    color:
        #2563eb;

    font-size:
        12px;

    font-weight:
        900;

    margin-bottom:
        8px;

}


.detail-description {

    color:
        #64748b;

    font-size:
        14px;

    line-height:
        1.7;

    margin-bottom:
        15px;

}


.info-box {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        8px;

    margin-top:
        15px;

}


.info-item {

    background:
        #f8fafc;

    border:
        1px solid #e2e8f0;

    padding:
        10px;

    border-radius:
        10px;

}


.info-label {

    color:
        #64748b;

    display:
        block;

    font-size:
        10px;

    margin-bottom:
        3px;

}


.info-value {

    font-size:
        12px;

    font-weight:
        800;

}


.detail-cart-btn {

    width:
        100%;

    border:
        none;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

    color:
        white;

    padding:
        14px;

    border-radius:
        12px;

    margin-top:
        20px;

    font-size:
        15px;

    font-weight:
        900;

    cursor:
        pointer;

}


/* ======================================================
   MULTIPLE IMAGES
====================================================== */

.gallery {

    display:
        flex;

    gap:
        8px;

    margin-top:
        10px;

    overflow-x:
        auto;

}


.gallery img {

    width:
        65px;

    height:
        65px;

    object-fit:
        contain;

    border:
        1px solid #e2e8f0;

    border-radius:
        9px;

    background:
        #f8fafc;

    cursor:
        pointer;

}


/* ======================================================
   VIDEO
====================================================== */

.product-video {

    width:
        100%;

    max-height:
        350px;

    margin-top:
        18px;

    border-radius:
        14px;

    background:
        #000;

}


/* ======================================================
   FOOTER
====================================================== */

.footer {

    text-align:
        center;

    padding:
        25px;

    color:
        #64748b;

    font-size:
        11px;

}


/* ======================================================
   RESPONSIVE
====================================================== */

@media(max-width:900px) {

    .product-grid {

        grid-template-columns:
            repeat(3,1fr);

    }

}


@media(max-width:650px) {

    .product-grid {

        grid-template-columns:
            repeat(2,1fr);

        gap:
            10px;

    }

    .product-image {

        height:
            145px;

    }

    .product-card {

        padding:
            9px;

    }

    .product-card h3 {

        font-size:
            14px;

    }

    .detail-grid {

        grid-template-columns:
            1fr;

    }

    .detail-image {

        height:
            250px;

    }

    .detail-title {

        font-size:
            22px;

    }

}


@media(max-width:380px) {

    .product-image {

        height:
            125px;

    }

}


</style>

</head>


<body>


<!-- ======================================================
     SHOP BAR
====================================================== -->

<div class="shop-bar">

    <div class="shop-bar-inner">

        <div>

            <div class="shop-title">
                🩺 GLOBAL HEALTHCARE
            </div>

            <div class="shop-subtitle">
                Premium Healthcare Products
            </div>

        </div>


        <a
            href="/doctor/cart"
            class="shop-cart"
        >

            🛒 Cart

            <span id="cartCount">
                0
            </span>

        </a>

    </div>

</div>



<!-- ======================================================
     MAIN
====================================================== -->

<main class="container">


    <div class="welcome">

        <h1>
            👨‍⚕️ Welcome Dr. __DOCTOR_NAME__
        </h1>

        <p>
            Browse healthcare products
        </p>

    </div>



    <div class="search-box">

        <input
            type="search"
            id="searchInput"
            class="search-input"
            placeholder="🔍 Search products..."
        >

    </div>



    <div class="shop-info">

        <h2>
            🛍️ All Products
        </h2>

        <span id="productCount">
            __PRODUCT_COUNT__ Products
        </span>

    </div>



    <div
        class="product-grid"
        id="productsGrid"
    ></div>


</main>



<!-- ======================================================
     MODAL
====================================================== -->

<div
    class="product-modal"
    id="productModal"
>

    <div class="product-detail">

        <button
            class="close-btn"
            onclick="closeProduct()"
        >
            ×
        </button>

        <div
            id="productDetailContent"
        ></div>

    </div>

</div>



<footer class="footer">

    © 2026

    <strong>
        GLOBAL HEALTHCARE
    </strong>

    <br>

    Powered by

    <strong>
        Osium Biogenix
    </strong>

</footer>



<script>

window.STORE_PRODUCTS =
    __PRODUCTS_JSON__;

</script>


<script src="/doctor/public/js/store.js"></script>


</body>

</html>
